<div class="chat-widget-container">
        
        <div class="chat-window" id="chatWindow">
            <div class="chat-header">
                <h3>Assistant du Musée</h3>
                <button class="close-chat-btn" onclick="toggleChat()">×</button>
            </div>
            
            <div class="chat-messages">
                <div class="message bot">
                    <p>Bonjour. Je suis l'assistant virtuel du musée. Comment puis-je vous aider à préparer votre visite aujourd'hui ?</p>
                </div>
                </div>
            
            <div class="chat-input-area">
                <input type="text" placeholder="Écrivez votre message...">
                <button class="send-btn">➤</button>
            </div>
        </div>

        <button class="chat-toggle-btn" onclick="toggleChat()">
        <span>&#10005;</span> 
        <img src="assets/chatbot_logo.png" alt="Chatbot">
    </button>

</div>
